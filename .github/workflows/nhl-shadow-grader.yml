name: NHL Shadow Grader

on:
  schedule:
    # Run once per hour at :17.
    # GitHub cron uses UTC.
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-shadow-grader
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: nfl_spread_sim_v1_2_expo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install grader dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Capture NHL closing-line snapshots
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python score_model/nhl/capture_clv_v079.py

      - name: Grade NHL shadow signals
        run: |
          python score_model/nhl/grade_shadow_signals_v078.py

      - name: Commit grading updates
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            nfl_spread_sim_v1_2_expo/artifacts/nhl/live/nhl_shadow_signals.csv \
            nfl_spread_sim_v1_2_expo/artifacts/nhl/live/nhl_shadow_summary.csv \
            nfl_spread_sim_v1_2_expo/artifacts/nhl/live/nhl_clv_snapshots.csv

          if git diff --cached --quiet; then
            echo "No NHL grading changes."
            exit 0
          fi

          git commit -m "Grade NHL shadow signals"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
