name: NFL SIM automatic week refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-sim-auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nfl_spread_sim_v1_2_expo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f requirements-model.txt ]; then
            python -m pip install -r requirements-model.txt
          else
            python -m pip install numpy pandas scipy scikit-learn joblib requests pyarrow
          fi

      - name: Refresh CURRENT + NEXT when needed
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        shell: bash
        run: |
          bash score_model/refresh_auto_v51.sh

      - name: Commit updated mobile board
        shell: bash
        run: |
          if git diff --quiet -- mobile/generatedData.ts; then
            echo "No mobile data change to commit."
            exit 0
          fi

          git config user.name "NFL SIM Auto Refresh"
          git config user.email "actions@users.noreply.github.com"

          git add mobile/generatedData.ts
          git commit -m "Auto refresh NFL current and next week"
          git push
